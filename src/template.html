<!DOCTYPE html>
<html lang="en">

<head>

  <title>Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  
</head>
<body class=" m-0  h-screen flex flex-col  bg-[#222222]">
<div class="header w-full h-auto border border-solid border-black">
  <h1 class="text-white text-5xl">Playtest Deck Name</h1>

  </div>
</div>
<div class="w-full h-full relative overflow-hidden p-5 border-[7px] border-solid border-[#465771] bg-[linear-gradient(to_right,rgba(135,136,136,0.1),_transparent_1px),_linear-gradient(to_bottom,_rgba(135,136,136,0.1)_1px,_transparent_1px)] bg-[size:15px_15px]"></div>
<div class="flex flex-row w-full h-60">

    <div class="flex justify-center w-1/3 items-center gap-3">
       <div>
        <p class=" text-center text-white text-sm ">Library: 1</p>
          <div class="card bg-[url('https://i.imgur.com/LdOBU1I.jpeg')] bg-cover "></div>
       </div>
       <div>
        <p class="text-center text-white text-sm">Graveyard: 0</p>

       </div>
       <div>

          <div class="card "></div>
       </div>

       </div> 

    </div>
</div>
